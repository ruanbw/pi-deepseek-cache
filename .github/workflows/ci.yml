name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pi 1.2.x declares engines.node ">=22.19.0" and its dist imports
      # fs.globSync (Node 22.14+), so Node 20 fails with
      # "does not provide an export named 'globSync'" as soon as the
      # extension imports @earendil-works/pi-coding-agent.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 只审计本包实际随附的依赖：package.json 没有 dependencies，宿主 pi 包走
      # peerDependencies、其余全是 devDependencies。全量 audit 会把 eslint 工具链
      # 与宿主 devDep 的传递告警算进来，而这些既不会发布也不会进用户运行时。
      - name: Audit (moderate+, shipped deps)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
